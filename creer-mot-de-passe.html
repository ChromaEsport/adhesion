<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Créer mon mot de passe - Chroma Esport
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="espace-membre-container">

        <div class="espace-membre-carte">

            <h1>
                CHROMA ESPORT
            </h1>

            <h2>
                Créer mon mot de passe
            </h2>

            <p>
                Entrez l'adresse e-mail utilisée lors de votre adhésion.
            </p>

            <form id="formMotDePasse">

                <div class="champ">

                    <label for="email">
                        Adresse e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                        autocomplete="email"
                    >

                </div>

                <button
                    type="submit"
                >
                    📧 Recevoir le lien
                </button>

            </form>

            <div
                id="message"
                class="message"
            ></div>

            <p>

                <a href="espace-membre.html">
                    ← Retour à la connexion
                </a>

            </p>

        </div>

    </main>

    <script
        type="module"
        src="creer-mot-de-passe.js"
    ></script>

</body>

</html>
