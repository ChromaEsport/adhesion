<title>

</title>

rel="stylesheet"

<body>


<header class="admin-header">


<div>

<h1>
CHROMA ESPORT
</h1>


<p>
Gestion des membres
</p>


</div>



<div class="navigation-admin">


<a 
href="dashboard.html"
class="bouton-navigation"
>

📋 Demandes

</a>



<a 
href="ajouter-membre.html"
class="bouton-navigation"
>

➕ Ajouter un membre

</a>



<button id="logout">

Déconnexion

</button>


</div>


</header>




<main class="admin-container">



<h2>
Membres de Chroma Esport
</h2>



<p class="description-dashboard">

Gestion des adhérents, cotisations et cartes membres.

</p>




<div class="onglets">



<button
class="onglet actif"
data-filtre="active"
>

🟢 Actifs

</button>



<button
class="onglet"
data-filtre="expiree"
>

🔴 Expirés

</button>



<button
class="onglet"
data-filtre="tous"
>

👥 Tous

</button>



</div>





<div class="recherche-membres">


<input

type="text"

id="rechercheMembre"

placeholder="🔎 Rechercher (nom, prénom, numéro membre, Discord)"

</div>






<div class="table-container">


<table class="table-membres">


<thead>


<tr>


<th>
N° membre
</th>


<th>
Nom
</th>


<th>

</th>


<th>
Discord
</th>


<th>
Ville
</th>


<th>
Statut
</th>


<th>
Paiement
</th>


<th>
Adhésion
</th>


<th>
Action
</th>


</tr>


</thead>




<tbody id="listeMembres">


<tr>

<td colspan="9">

Chargement des membres...

</td>

</tr>


</tbody>



</table>


</div>



</main>





<script
type="module"
src="membres.js"
></script>
