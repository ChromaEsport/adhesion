<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Gestion des membres - Chroma Esport
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<header class="admin-header">


<div>

<h1>
CHROMA ESPORT
</h1>

<p>
Gestion des membres
</p>

</div>



<div class="navigation-admin">


<a
href="dashboard.html"
class="bouton-navigation"
>
📋 Demandes
</a>


<a
href="ajouter-membre.html"
class="bouton-navigation"
>
➕ Ajouter un membre
</a>


<button id="logout">
Déconnexion
</button>


</div>


</header>



<main class="admin-container">


<h2>
Membres de Chroma Esport
</h2>


<p class="description-dashboard">

Consultez les adhésions, paiements et informations membres.

</p>



<div class="onglets">


<button
class="onglet actif"
data-filtre="en_attente_paiement"
>
En attente paiement
</button>


<button
class="onglet"
data-filtre="active"
>
Actifs
</button>


<button
class="onglet"
data-filtre="expiree"
>
Expirés
</button>


<button
class="onglet"
data-filtre="tous"
>
Tous
</button>


</div>



<div class="recherche-membres">


<input

type="text"

id="rechercheMembre"

placeholder="🔎 Rechercher un membre..."

>


</div>



<div class="table-container">


<table class="table-membres">


<thead>

<tr>

<th>
Numéro
</th>


<th>
Nom
</th>


<th>
Discord
</th>


<th>
Paiement
</th>


<th>
Adhésion
</th>


<th>
Statut
</th>


<th>
Action
</th>


</tr>

</thead>



<tbody id="listeMembres">


<tr>

<td colspan="7">

Chargement des membres...

</td>

</tr>


</tbody>


</table>


</div>



</main>




<script
type="module"
src="membres.js"
></script>


</body>


</html>
