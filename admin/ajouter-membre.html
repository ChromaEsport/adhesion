<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Ajouter un membre - Chroma Esport
</title>


<link rel="stylesheet" href="ajouter-membre.css">


</head>


<body>



<header class="admin-header">


<div>

<h1>
CHROMA ESPORT
</h1>


<p>
Ajouter un membre manuellement
</p>

</div>



<div class="navigation-admin">


<a
href="membres.html"
class="bouton-navigation"
>
👥 Membres
</a>


<a
href="dashboard.html"
class="bouton-navigation"
>
📋 Demandes
</a>


<button id="logout">
Déconnexion
</button>


</div>


</header>





<main class="admin-container">


<h2>
Ajouter un membre
</h2>



<div class="formulaire-admin">


<form id="formAjoutMembre">



<h3>
Identité
</h3>


<div class="ligne-form">


<input
id="prenom"
type="text"
placeholder="Prénom"
required
>


<input
id="nom"
type="text"
placeholder="Nom"
required
>


</div>

<h3>
Date de naissance
</h3>

<input
id="dateNaissance"
type="date"
placeholder="Jour/Mois/Année"
required
>



<h3>
Contact
</h3>



<input
id="email"
type="email"
placeholder="Email"
required
>


<input
id="discord"
type="text"
placeholder="Discord"
>




<h3>
Adresse
</h3>



<input
id="adresse"
type="text"
placeholder="Adresse"
>


<input
id="complementAdresse"
type="text"
placeholder="Complément d'adresse"
>


<div class="ligne-form">


<input
id="codePostal"
type="text"
placeholder="Code postal"
>


<input
id="ville"
type="text"
placeholder="Ville"
>


</div>



<input
id="pays"
type="text"
placeholder="Pays"

>




<h3>
Cotisation & Don
</h3>



<div class="ligne-form">


<input
id="cotisation"
type="number"
placeholder="Cotisation"
>


<input
id="don"
type="number"
placeholder="Don"
>


</div>




<button
type="submit"
class="bouton-validation"
>

➕ Créer le membre

</button>



<p
id="message"
>

</p>



</form>



</div>



</main>




<script
type="module"
src="ajouter-membre.js"
></script>



</body>

</html>
